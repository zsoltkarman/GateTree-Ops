name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version without v (for example 0.1.15)'
        required: true
        type: string
      notes:
        description: 'Release notes shown to users'
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: gatetree-ops-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release configuration
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GATETREE_OPS_UPDATES_TOKEN }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          : "${GH_TOKEN:?Configure GATETREE_OPS_UPDATES_TOKEN first}"
          : "${SIGNING_KEY:?Configure TAURI_SIGNING_PRIVATE_KEY first}"
          version="${REQUESTED_VERSION:-${RELEASE_TAG#v}}"
          python3 scripts/set-version.py "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          gh repo view zsoltkarman/GateTree-Ops-updates --json visibility --jq .visibility | python3 -c 'import sys; assert sys.stdin.read().strip() == "PUBLIC", "Updates repository must be public"'
          if gh release view "v$version" --repo zsoltkarman/GateTree-Ops-updates >/dev/null 2>&1; then
            echo "This version already exists. Choose a new version; released packages must not be overwritten."
            exit 1
          fi

  build:
    needs: prepare
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact_name: gatetree-ops-macos
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
          - name: Windows x64
            runner: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            artifact_name: gatetree-ops-windows
            bundle: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Set GUI and Agent version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/set-version.py "$RELEASE_VERSION"
        shell: bash
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Prepare native Agent for GUI tests
        shell: bash
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml -p gatetree-ops-agent
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          if [ "$RUNNER_OS" = Windows ]; then
            cp src-tauri/target/debug/gatetree-ops-agent.exe "src-tauri/binaries/gatetree-ops-agent-$host_target.exe"
          else
            cp src-tauri/target/debug/gatetree-ops-agent "src-tauri/binaries/gatetree-ops-agent-$host_target"
          fi
      - name: Run checks
        shell: bash
        run: |
          node --test scripts/tests/*.test.mjs
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          cargo test --locked --manifest-path src-tauri/Cargo.toml -p gatetree-ops -p gatetree-ops-agent-core --lib
      - name: Import macOS signing identity
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          : "${APPLE_CERTIFICATE:?Configure APPLE_CERTIFICATE first}"
          : "${APPLE_API_PRIVATE_KEY:?Configure APPLE_API_PRIVATE_KEY first}"
          umask 077
          keychain_path="$RUNNER_TEMP/gatetree-ops-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$RUNNER_TEMP/gatetree-ops-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/gatetree-ops-signing.p12" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/gatetree-ops-notary.p8"
      - name: Build signed and notarized macOS release
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/gatetree-ops-notary.p8
        run: ./scripts/build-macos.sh
      - name: Build Windows per-user setup and MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/macos/*.app.tar.gz
            ${{ matrix.bundle }}/macos/*.app.tar.gz.sig
            ${{ matrix.bundle }}/nsis/*-setup.exe
            ${{ matrix.bundle }}/nsis/*-setup.exe.sig
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/msi/*.msi.sig
          if-no-files-found: error
      - name: Remove macOS signing material
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/gatetree-ops-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/gatetree-ops-signing.p12" "$RUNNER_TEMP/gatetree-ops-notary.p8"

  release:
    name: Create draft release for review
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: release-artifacts
      - name: Generate updater manifest and release notes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          notes = os.environ.get('RELEASE_NOTES') or Path('RELEASE_NOTES.md').read_text()
          notes += '\n\nGUI and Agent are bundled together.\nmacOS: install into ~/Applications.\nWindows: use the per-user Setup EXE for administrator-free updates.\n\nSource commit: ' + os.environ['SOURCE_COMMIT'] + '\n'
          Path('release-notes.txt').write_text(notes)
          PY
          python3 scripts/create-update-manifest.py release-artifacts --version "$RELEASE_VERSION" --notes-file release-notes.txt
      - name: Create draft in the public updates repository
        env:
          GH_TOKEN: ${{ secrets.GATETREE_OPS_UPDATES_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mapfile -d '' assets < <(find release-artifacts -type f -print0)
          gh release create "v$RELEASE_VERSION" "${assets[@]}" --repo zsoltkarman/GateTree-Ops-updates --draft --title "GateTree-Ops $RELEASE_VERSION" --notes-file release-notes.txt
